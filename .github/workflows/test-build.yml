name: Build OnePlus 8T Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Defconfig'
        required: true
        default: 'kona-perf'
        type: choice
        options:
          - kona-perf
          - kona

      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh

      ksu:
        description: 'Enable KernelSU'
        required: true
        type: boolean
        default: true
        
jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive'

    - name: Checkout OnePlus Vendor Modules
      run: |
        git clone --depth=1 \
          https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git \
          $RUNNER_TEMP/oneplus-modules
        git -C $RUNNER_TEMP/oneplus-modules fetch --depth=1 origin 0a301570ef70f6f9bfe1840451c9d41f5ddce6b8
        git -C $RUNNER_TEMP/oneplus-modules checkout --detach 0a301570ef70f6f9bfe1840451c9d41f5ddce6b8
        mv $RUNNER_TEMP/oneplus-modules/vendor $GITHUB_WORKSPACE/../../vendor
        mv $RUNNER_TEMP/oneplus-modules/kernel/msm-4.19/techpack/{camera,display,video} $GITHUB_WORKSPACE/techpack/
        ln -s ../19805/camera $GITHUB_WORKSPACE/../../vendor/qcom/proprietary/devicetree-4.19/qcom/camera
        ln -s ../../../camera-devicetree/kona-camera-sensor-arglass.dtsi \
          $GITHUB_WORKSPACE/../../vendor/qcom/proprietary/devicetree-4.19/qcom/camera/
        ln -s $GITHUB_WORKSPACE $GITHUB_WORKSPACE/kernel/msm-4.19

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl bison flex zip bc cpio libssl-dev python3-minimal python-is-python3 libelf-dev libtinfo5 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

    - name: Setup Toolchain (Snapdragon LLVM 10.0.7)
      run: |
        mkdir -p $HOME/zyc-clang
        curl -LSs https://github.com/sticpaper/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK/archive/a16fec82a8deaf8f742ea54f8de98c021af200d4.tar.gz \
          | tar -xz --strip-components=1 -C $HOME/zyc-clang
        $HOME/zyc-clang/bin/clang --version
        aarch64-linux-gnu-ld --version
        arm-linux-gnueabi-ld --version

    - name: Build Kernel
      run: |
        chmod +x build.sh
        
        echo "Using script: ${{ inputs.script }}"

        if [ "${{ inputs.ksu }}" == "true" ]; then
          echo "Building with KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }} ksu
        else
          echo "Building without KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ inputs.device }}-${{ inputs.ksu && 'KSU' || 'NoKSU' }}-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error
